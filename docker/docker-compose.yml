version: '3.9'

services:
  envoy:
    image: envoyproxy/envoy-dev:latest
    container_name: envoy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8079:8079"
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
      - "8085:8085"
      - "8086:8086"
    volumes:
      - ./../config/envoy.test.yaml:/config/envoy.test.yaml
    command:
      - -c
      - ../config/envoy.test.yaml

  node1:
    build: haveno/
    container_name: node1
    # restore-cache.sh restores a pre-mined blockchain (if present) so monerod
    # boots already past height 0 instead of mining the local testnet each run,
    # then exec's ./.localnet/monerod with the args in `command`.
    entrypoint: [ "/bin/bash", "/blockchain-cache/restore-cache.sh" ]
    volumes:
      - ./blockchain-cache:/blockchain-cache:ro
    command: [
      "--testnet",
      "--no-igd",
      "--hide-my-port",
      "--data-dir=./.localnet/xmr_local/node1",
      "--p2p-bind-ip=127.0.0.1",
      "--no-zmq",
      "--log-level=0",
      "--add-exclusive-node=127.0.0.1:48080",
      "--add-exclusive-node=127.0.0.1:58080",
      "--rpc-access-control-origins=http://localhost:8080",
      "--fixed-difficulty=150",
      "--disable-rpc-ban",
      "--rpc-max-connections=1000",
      "--max-connections-per-ip=10",
      "--rpc-max-connections-per-private-ip=1000",
      "--non-interactive"
    ]
    network_mode: "host"
    # monerod testnet RPC is on 28081
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/28081" ]
      interval: 5s
      timeout: 4s
      retries: 60
      start_period: 10s

  node2:
    build: haveno/
    container_name: node2
    # restore-cache.sh restores a pre-mined blockchain (if present) so monerod
    # boots already past height 0 instead of mining the local testnet each run,
    # then exec's ./.localnet/monerod with the args in `command`.
    entrypoint: [ "/bin/bash", "/blockchain-cache/restore-cache.sh" ]
    volumes:
      - ./blockchain-cache:/blockchain-cache:ro
    command: [
      "--testnet",
      "--no-igd",
      "--hide-my-port",
      "--data-dir=./.localnet/xmr_local/node2",
      "--p2p-bind-ip=127.0.0.1",
      "--p2p-bind-port=48080",
      "--rpc-bind-port=48081",
      "--no-zmq",
      "--add-exclusive-node=127.0.0.1:28080",
      "--add-exclusive-node=127.0.0.1:58080",
      "--rpc-access-control-origins=http://localhost:8080",
      "--fixed-difficulty=150",
      "--disable-rpc-ban",
      "--rpc-max-connections=1000",
      "--max-connections-per-ip=10",
      "--rpc-max-connections-per-private-ip=1000",
      "--non-interactive"
    ]
    network_mode: "host"
    depends_on:
      node1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/48081" ]
      interval: 5s
      timeout: 4s
      retries: 60
      start_period: 10s

  seed1:
    build: haveno/
    container_name: seed1
    entrypoint: [ "./haveno-seednode" ]
    command: [
      "--baseCurrencyNetwork=XMR_LOCAL",
      "--useLocalhostForP2P=true",
      "--useDevPrivilegeKeys=true",
      "--nodePort=2002",
      "--appName=haveno-XMR_LOCAL_Seed1_2002",
      "--xmrNode=http://localhost:28081"
    ]
    network_mode: "host"
    # wait for the monerod it connects to (node1) to be serving RPC before bootstrapping
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
    # seednode P2P port is 2002
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/2002" ]
      interval: 5s
      timeout: 4s
      retries: 90
      start_period: 20s

  seed2:
    build: haveno/
    container_name: seed2
    entrypoint: [ "./haveno-seednode" ]
    command: [
      "--baseCurrencyNetwork=XMR_LOCAL",
      "--useLocalhostForP2P=true",
      "--useDevPrivilegeKeys=true",
      "--nodePort=3002",
      "--appName=haveno-XMR_LOCAL_Seed2_3002",
      "--xmrNode=http://localhost:28081"
    ]
    network_mode: "host"
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
    # seednode P2P port is 3002
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/3002" ]
      interval: 5s
      timeout: 4s
      retries: 90
      start_period: 20s

  arbitrator:
    build: haveno/
    container_name: arbitrator
    entrypoint: [ "./haveno-daemon" ]
    command: [
      "--baseCurrencyNetwork=XMR_LOCAL",
      "--useLocalhostForP2P=true",
      "--useDevPrivilegeKeys=true",
      "--nodePort=4444",
      "--appName=haveno-XMR_LOCAL_arbitrator",
      "--apiPassword=apitest",
      "--apiPort=9998",
      "--walletRpcBindPort=38090",
      "--passwordRequired=false",
      "--xmrNode=http://localhost:48081",
    ]
    network_mode: "host"
    # only start once both seed nodes are accepting P2P connections, so the daemon bootstraps with data
    depends_on:
      node2:
        condition: service_healthy
      seed1:
        condition: service_healthy
      seed2:
        condition: service_healthy

  user1:
    build: haveno/
    container_name: user1
    entrypoint: [ "./haveno-daemon" ]
    command: [
      "--baseCurrencyNetwork=XMR_LOCAL",
      "--useLocalhostForP2P=true",
      "--useDevPrivilegeKeys=true",
      "--nodePort=5555",
      "--appName=haveno_user1",
      "--apiPassword=apitest",
      "--apiPort=9999",
      "--walletRpcBindPort=38091",
      "--passwordRequired=false",
    ]
    network_mode: "host"
    depends_on:
      seed1:
        condition: service_healthy
      seed2:
        condition: service_healthy

  user2:
    build: haveno/
    container_name: user2
    entrypoint: [ "./haveno-daemon" ]
    command: [
      "--baseCurrencyNetwork=XMR_LOCAL",
      "--useLocalhostForP2P=true",
      "--useDevPrivilegeKeys=true",
      "--nodePort=6666",
      "--appName=haveno_user2",
      "--apiPassword=apitest",
      "--apiPort=10000",
      "--walletRpcBindPort=38092",
      "--passwordRequired=false",
    ]
    network_mode: "host"
    depends_on:
      seed1:
        condition: service_healthy
      seed2:
        condition: service_healthy

  pricenode:
    build: pricenode/
    container_name: pricenode
    entrypoint: [ "./haveno-pricenode" ]
    network_mode: "host"

  funding:
    build: haveno/
    container_name: funding_wallet
    entrypoint: [ "./.localnet/monero-wallet-rpc" ]
    command: [
      "--testnet",
      "--daemon-address=http://localhost:28081",
      "--rpc-bind-port=28084",
      "--rpc-login=rpc_user:abc123",
      "--rpc-access-control-origins=http://localhost:8080",
      "--wallet-dir=./.localnet",
    ]
    network_mode: "host"
    # funding wallet talks to node1 (28081); wait for it to be serving RPC
    depends_on:
      node1:
        condition: service_healthy
